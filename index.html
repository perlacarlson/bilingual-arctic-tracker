<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bilingual Artic & Phonology Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bilingual Artic Tracker</h1>
    
    <!-- Clinical Language Context Mode -->
    <div class="lang-selector-group">
      <span class="selector-label">Language Context:</span>
      <div class="segmented-control">
        <button type="button" class="lang-btn active" id="btn-lang-es" onclick="setLanguageContext('Spanish Only')">Spanish Only</button>
        <button type="button" class="lang-btn" id="btn-lang-en" onclick="setLanguageContext('English Only')">English Only</button>
        <button type="button" class="lang-btn" id="btn-lang-bi" onclick="setLanguageContext('Bilingual (Both)')">Bilingual / Both</button>
      </div>
    </div>

    <!-- Active Sound & Optional Word Banner -->
    <div class="target-card">
      <div class="target-field-row">
        <div class="field-item">
          <label for="target-sound-input">Target Sound / Phoneme</label>
          <input 
            type="text" 
            id="target-sound-input" 
            value="/r/ (Múltiple)" 
            placeholder="e.g., /s/, /r/, /k/ vs /t/"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
        <div class="field-item">
          <label for="target-word-input">Stimulus Word (Optional)</label>
          <input 
            type="text" 
            id="target-word-input" 
            placeholder="Leave blank for sound-only"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
      </div>
      <div class="quick-sound-pills">
        <span class="pill-label">Quick Sounds:</span>
        <button type="button" class="sound-chip" onclick="quickSelectSound('/r/ (Múltiple)')">/r/ Múltiple</button>
        <button type="button" class="sound-chip" onclick="quickSelectSound('/ɾ/ (Simple)')">/ɾ/ Simple</button>
        <button type="button" class="sound-chip" onclick="quickSelectSound('Coda /s/')">Coda /s/</button>
        <button type="button" class="sound-chip" onclick="quickSelectSound('/k/ vs /t/ (Velar Fronting)')">/k/ vs /t/</button>
        <button type="button" class="sound-chip" onclick="quickSelectSound('English Vocalic /r/')">Vocalic /r/</button>
        <button type="button" class="sound-chip" onclick="quickSelectSound('General Probe')">General Probe</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Session Parameters Bar (Client Code & Target Trial Goal) -->
    <section class="session-meta-grid">
      <div class="meta-field">
        <label for="client-id-input">Client ID / Code:</label>
        <input 
          type="text" 
          id="client-id-input" 
          placeholder="e.g., JR or #104" 
          maxlength="12"
          autocomplete="off"
          spellcheck="false"
        >
      </div>
      <div class="meta-field">
        <label for="target-trials-input">Target Trial Block:</label>
        <div class="trial-block-input-wrap">
          <input 
            type="number" 
            id="target-trials-input" 
            value="20" 
            min="1" 
            max="500" 
            step="5"
          >
          <span class="unit-label">trials</span>
        </div>
      </div>
    </section>

    <!-- Trial Goal Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <!-- Metrics Dashboard -->
    <section class="metrics">
      <div class="card">
        <span class="label">Completed Trials</span>
        <span class="value" id="trial-count-display">0 / 20</span>
      </div>
      <div class="card">
        <span class="label">Session Acc</span>
        <span class="value" id="overall-acc">0%</span>
      </div>
      <div class="card">
        <span class="label">Ind Mastery</span>
        <span class="value" id="ind-acc">0%</span>
      </div>
    </section>

    <!-- Rapid Tactical Trial Buttons -->
    <section class="buttons-grid">
      <button type="button" class="btn btn-ind" onclick="logTrial('ind')">+ Independent</button>
      <button type="button" class="btn btn-low" onclick="logTrial('low')">+ Low Cue</button>
      <button type="button" class="btn btn-mod" onclick="logTrial('mod')">+ Mod Cue</button>
      <button type="button" class="btn btn-max" onclick="logTrial('max')">+ Max Cue</button>
      <button type="button" class="btn btn-err" onclick="logTrial('err')">- Incorrect</button>
    </section>

    <!-- Primary Control Strip -->
    <section class="controls">
      <button type="button" class="btn-secondary" onclick="undoLast()">Undo (U)</button>
      <button type="button" class="btn-secondary btn-export" onclick="exportToCSV()">📥 Export CSV</button>
      <button type="button" class="btn-secondary" onclick="resetSession()">Reset</button>
    </section>

    <!-- Interactive Session Ledger (Live & Retroactive Editing) -->
    <section class="trial-history-section">
      <div class="history-header">
        <h3>Session Ledger (<span id="ledger-count">0</span> trials)</h3>
        <small>Tap Sound, Word, or Cue to edit retroactively</small>
      </div>
      <div class="trial-ledger-scroll">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Target Sound</th>
              <th>Word (Optional)</th>
              <th>Lang</th>
              <th>Support Level</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="trial-ledger-body">
            <tr>
              <td colspan="6" class="empty-ledger-msg">No trials recorded yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Automated Clinical Note -->
    <section class="documentation">
      <div class="doc-header">
        <h3>Generated SOAP Objective Note</h3>
        <div class="doc-actions">
          <button type="button" class="copy-btn" onclick="copySoapNote()">📋 Copy Note</button>
          <button type="button" class="copy-btn" onclick="copyRawCSV()">📋 Copy CSV</button>
        </div>
      </div>
      <textarea id="soap-output" readonly rows="4"></textarea>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
